name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    name: Testes (PostgreSQL real)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          # credenciais FICTÍCIAS, só deste banco descartável do CI
          POSTGRES_DB: biblioteca_test
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-somente-para-testes
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d biblioteca_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DB_URL: jdbc:postgresql://localhost:5432/biblioteca_test
      TEST_DB_USER: ci
      TEST_DB_PASSWORD: ci-somente-para-testes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compilar e rodar os testes
        run: mvn -B verify
      - name: Publicar o jar
        uses: actions/upload-artifact@v4
        with:
          name: api-biblioteca-escolar-jar
          path: target/api-biblioteca-escolar-*.jar
          if-no-files-found: error
      - name: Publicar relatórios de teste (se algo falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports

  docker:
    name: Docker Compose (sobe tudo e usa a API)
    runs-on: ubuntu-latest
    needs: testes
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Gerar um .env descartável com senhas aleatórias
        run: |
          {
            echo "DB_USER=biblioteca"
            echo "DB_PASSWORD=$(openssl rand -hex 16)"
            echo "BIBLIOTECA_ADMIN_USER=bibliotecario"
            echo "BIBLIOTECA_ADMIN_PASSWORD=$(openssl rand -hex 16)"
          } > .env
      - name: Subir o banco e a API
        run: docker compose up -d --build --wait --wait-timeout 240
      - name: Usar a API de verdade
        run: |
          set -eu
          . ./.env
          B=http://localhost:8080
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          echo "saúde:";                 curl -fs "$B/actuator/health"; echo
          [ "$(code "$B/api/livros")" = 200 ]                                    # catálogo público
          [ "$(code "$B/api/leitores")" = 401 ]                                  # dados pessoais exigem login
          [ "$(code -u "$BIBLIOTECA_ADMIN_USER:senha-errada" "$B/api/leitores")" = 401 ]
          [ "$(code -u "$BIBLIOTECA_ADMIN_USER:$BIBLIOTECA_ADMIN_PASSWORD" "$B/api/leitores")" = 200 ]
          curl -fs -u "$BIBLIOTECA_ADMIN_USER:$BIBLIOTECA_ADMIN_PASSWORD" -H 'Content-Type: application/json' \
            -X POST "$B/api/livros" -d '{"titulo":"Dom Casmurro","autor":"Machado de Assis"}' | grep -q '"titulo":"Dom Casmurro"'
          [ "$(code "$B/swagger-ui/index.html")" = 200 ]
          echo "ok"
      - name: Logs (se algo falhar)
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Derrubar
        if: always()
        run: docker compose down -v
