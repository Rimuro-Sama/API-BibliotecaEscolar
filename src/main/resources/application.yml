spring:
  application:
    name: api-biblioteca-escolar
  datasource:
    # Sem valores padrão para usuário e senha de propósito: nada de credencial no código.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/biblioteca}
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false            # nada de consultas "escondidas" durante a serialização da resposta
    hibernate:
      ddl-auto: validate           # o esquema é responsabilidade do Flyway; o Hibernate só confere
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: always
  web:
    locale: pt-BR                  # mensagens de validação em português, independente do Accept-Language
    locale-resolver: fixed

biblioteca:
  admin:
    user: ${BIBLIOTECA_ADMIN_USER:}
    password: ${BIBLIOTECA_ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
